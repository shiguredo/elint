name: Create GitHub Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      # Guard against a `v*` tag whose name does not match Cargo.toml.
      # The release binaries are built from the tagged commit, so a tag
      # like `v0.1.2` against a crate still on `version = "0.1.1"` would
      # attach binaries whose `--version` disagrees with the tag.
      # `cargo metadata + jq` is preferred over `cargo pkgid | sed` so
      # a future change to cargo's pkgid output format cannot silently
      # break the check. `jq` is preinstalled on ubuntu-latest.
      - name: Tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "elint") | .version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "tag version ($tag_version) does not match Cargo.toml version ($cargo_version)"
            exit 1
          fi
      # The `validate` job re-runs the CI suite so a broken commit
      # that somehow received a `v*` tag never becomes a release, even if
      # the push-time CI on that commit failed or was skipped.
      - run: cargo test --all
      - run: cargo test --doc
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all -- -D warnings
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: create-release
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release must already exist before any asset upload, so every binary
  # job depends on `github-release`. The three jobs run in parallel and
  # attach statically linked or SDK-pinned binaries to the same tag.
  # Asset names strip the leading `v` from the tag, e.g. `elint-0.0.3.xxx`.

  linux-x86_64-binary:
    name: Upload Binary for Linux x86_64
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # musl-tools provides the musl linker for a fully static binary.
      - run: sudo apt install -y musl-tools
      - run: rustup update stable
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target=x86_64-unknown-linux-musl
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv target/x86_64-unknown-linux-musl/release/elint \
            elint-${GITHUB_REF_NAME#v}.x86_64-unknown-linux-musl
          gh release upload ${{ github.ref_name }} \
            elint-${GITHUB_REF_NAME#v}.x86_64-unknown-linux-musl

  linux-arm64-binary:
    name: Upload Binary for Linux arm64
    needs: github-release
    # arm64 native runner, so aarch64-unknown-linux-musl needs no cross
    # toolchain: apt musl-tools on this image is the aarch64 one.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt install -y musl-tools
      - run: rustup update stable
      - run: rustup target add aarch64-unknown-linux-musl
      - run: cargo build --release --target=aarch64-unknown-linux-musl
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv target/aarch64-unknown-linux-musl/release/elint \
            elint-${GITHUB_REF_NAME#v}.aarch64-unknown-linux-musl
          gh release upload ${{ github.ref_name }} \
            elint-${GITHUB_REF_NAME#v}.aarch64-unknown-linux-musl

  macos-binary:
    name: Upload Binary for macOS
    needs: github-release
    # macos-15 (not macos-latest): the older SDK keeps the minimum macOS
    # version of the produced binaries low and the image stable.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup target add aarch64-apple-darwin
      - run: cargo build --release --target=aarch64-apple-darwin
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv target/aarch64-apple-darwin/release/elint \
            elint-${GITHUB_REF_NAME#v}.aarch64-apple-darwin
          gh release upload ${{ github.ref_name }} \
            elint-${GITHUB_REF_NAME#v}.aarch64-apple-darwin
